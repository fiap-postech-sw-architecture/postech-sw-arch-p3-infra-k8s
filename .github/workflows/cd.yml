# CD do cluster EKS: homolog -> terraform plan; main -> terraform apply.
# Credenciais ROTATIVAS: cada Start Lab do AWS Academy emite novo trio
#    access key + secret + session token. Os secrets AWS_* deste repo
#    precisam ser re-gravados a cada sessão ANTES de qualquer run —
#    passo 1 do runbook `aws-academy-setup.md` (repo postech-sw-arch-p3-docs).
#    Sem sessão ativa, qualquer run falha com credencial expirada.
# O state remoto e compartilhado; nao execute Terraform local enquanto
# este workflow estiver em execucao.

name: cd

on:
  push:
    branches: [main, homolog]

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  plan:
    if: github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: terraform plan
        run: |
          terraform init -input=false
          terraform plan -input=false

  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: terraform apply
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
